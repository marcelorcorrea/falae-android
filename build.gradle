// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.1.0'
    ext.lifecycle_version = '2.7.0'
    ext.room_version = '2.6.1'
    ext.core_ktx_version = '1.12.0'
    ext.appcompat_version = '1.6.1'
    ext.material_version = '1.11.0'
    ext.constraint_layout_version = '2.1.4'
    ext.recyclerview_version = '1.3.2'
    ext.fragment_version = '1.6.2'
    ext.activity_version = '1.8.2'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Repositories are now defined in settings.gradle

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}



